name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r --filter "./packages/*" test
      - run: pnpm build:packages

  build-apps:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm storybook:build
      - run: pnpm --filter @feu/site build
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-html
          path: apps/storybook-html/storybook-static
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-ng
          path: apps/storybook-ng/storybook-static

  visual-regression:
    needs: build-apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm storybook:build
      - name: Install Playwright browsers
        run: pnpm --filter @feu/visual-regression exec playwright install --with-deps chromium
      - name: Serve storybooks and run visual regression
        run: |
          npx --yes http-server apps/storybook-html/storybook-static -p 6006 &
          npx --yes http-server apps/storybook-ng/storybook-static -p 6007 &
          npx --yes wait-on http://localhost:6006 http://localhost:6007
          pnpm vr
        env:
          STORYBOOK_HTML_URL: http://localhost:6006
          STORYBOOK_NG_URL: http://localhost:6007
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tools/visual-regression/playwright-report
